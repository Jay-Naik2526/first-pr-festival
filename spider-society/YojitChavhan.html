<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider-ID Card — Yojit Chavhan</title>
  <style>
    /* ── Page reset ─────────────────────────────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: system-ui, sans-serif;
    }

    /* ── Yojit's suit ──────────────────────────────────────── */
    .spider-card {
      --suit: #e62429;
      --ink: #08080a;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 22px;
      font-family: system-ui, sans-serif;
      color: #e8e6e3;
      background: radial-gradient(circle at 30% 0%, #2a0508, var(--ink) 70%);
      border: 2px solid var(--suit);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    /* Webbing pattern */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.06) 0 1px,
          transparent 1px 14px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.06) 0 1px,
          transparent 1px 14px
        );
      pointer-events: none;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 2px solid var(--suit);
      object-fit: cover;
      box-shadow: 0 0 22px rgba(230, 36, 41, 0.5);
    }

    .alias {
      margin: 14px 0 2px;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 0.5px;
      color: var(--suit);
      text-transform: uppercase;
    }

    .name {
      margin: 0;
      font-size: 14px;
      opacity: 0.75;
    }

    .handle {
      margin-top: 4px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      opacity: 0.55;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 5px 10px;
      font-size: 12px;
      border: 1px solid var(--suit);
      border-radius: 999px;
      background: rgba(230, 36, 41, 0.12);
    }

    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.45;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <!--
    SPIDER-ID CARD — Yojit Chavhan
    1. Internal CSS only — no external stylesheets.
    2. No <script> tags.
    3. Card: 320 x 440.
    4. Four data- attributes on .spider-card.
  -->
  <div
    class="spider-card"
    data-name="Yojit Chavhan"
    data-alias="Thanos"
    data-github="YojitChavhan"
    data-suit="##FF0000"
  >
    <img class="avatar" src="https://github.com/YojitChavhan.png" alt="" />

    <h1 class="alias">Dr Doom</h1>
    <p class="name">Yojit Chavhan</p>
    <p class="handle">@YojitChavhan</p>

    <ul class="skills">
      <li>Python</li>
      <li>C++</li>
      <li>Cybersecurity</li>
      <li>Cloud</li>
      <li>React</li>
      <li>Flutter</li>
    </ul>

    <div class="footer">
      <span>Spider-Society</span>
      <span>Earth-1610</span>
    </div>
  </div>

</body>
</html>
