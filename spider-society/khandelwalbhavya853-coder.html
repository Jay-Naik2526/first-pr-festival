<div
  class="spider-card"
  data-name="Bhavya"
  data-alias="Scarlet Web"
  data-github="bhavya-github"
  data-suit="#E62429"
>
  <style>
    .spider-card {
      --suit: #e62429;
      --ink: #0a0a0a;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 18px;
      font-family: "Bangers", cursive, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #e62429 20%, #0a0a0a 100%);
      border: 4px solid var(--suit);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Web check overlay */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.15) 0 2px,
          transparent 2px 20px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(255,255,255,0.15) 0 2px,
          transparent 2px 20px
        );
      opacity: 0.35;
      pointer-events: none;
    }

    /* Mask avatar */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #e62429;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      top: 35%;
      width: 30%;
      height: 25%;
      background: #fff;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 0 0 5px #000;
    }
    .avatar::before { left: 15%; transform: rotate(-10deg); }
    .avatar::after { right: 15%; transform: rotate(10deg); }

    /* Text suspended in web */
    .alias, .name, .handle {
      position: relative;
      text-align: center;
      margin: 12px 0;
    }
    .alias::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -12px;
      width: 2px;
      height: 14px;
      background: #fff;
      transform: translateX(-50%);
    }
    .alias {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      text-shadow: 3px 3px #000, 0 0 10px #e62429;
      text-transform: uppercase;
    }
    .name, .handle {
      font-size: 14px;
      opacity: 0.85;
      font-family: "Roboto Condensed", sans-serif;
    }

    /* Skills caught in web */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      padding: 0;
      list-style: none;
      justify-content: center;
    }
    .skills li {
      padding: 6px 12px;
      font-size: 12px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: #000;
      color: #e62429;
      font-family: "Bangers", cursive;
      box-shadow: 2px 2px #fff, 0 0 10px #e62429;
      position: relative;
      transform: rotate(-3deg);
    }
    .skills li::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 2px;
      height: 10px;
      background: #fff;
      transform: translateX(-50%);
    }

    .footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.65;
      border-top: 2px solid rgba(255,255,255,0.25);
      padding-top: 8px;
    }
  </style>

  <div class="avatar"></div>

  <h1 class="alias">Scarlet Web</h1>
  <p class="name">Bhavya</p>
  <p class="handle">khandelwalbhavya853@gmail.com</p>

  <ul class="skills">
    <li>Web-Slinging</li>
    <li>Agility</li>
    <li>Code Sense</li>
  </ul>

  <div class="footer">
    <span>Spider-Society</span>
    <span>Earth-1610</span>
  </div>
</div>
