<!--
  SPIDER-ID CARD — weave your own suit.

  RULES
  1. Rename this file to <your-github-username>.html
  2. Internal CSS only — keep it inside the <style> block below.
  3. No <script> tags. They are stripped and CI will reject them.
  4. Everything must fit inside 320 x 440. That's the card.
  5. Keep the four data- attributes on .spider-card — the roster reads them.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spider-ID Card — dhairyajadon30</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  .spider-card {
    position: relative;
    width: 320px;
    height: 440px;
    overflow: hidden;
    border-radius: 14px;
    background:
      radial-gradient(circle at 50% 12%, rgba(179, 0, 0, 0.4), transparent 55%),
      #060606;
    border: 1px solid #3a0000;
    box-shadow:
      0 0 0 1px #000,
      0 12px 40px rgba(0, 0, 0, 0.7),
      0 0 30px rgba(200, 0, 0, 0.15) inset;
  }

  /* faint red crack/web lines across the whole card */
  .web-lines {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(179,0,0,0.05) 0px, rgba(179,0,0,0.05) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(65deg, rgba(179,0,0,0.05) 0px, rgba(179,0,0,0.05) 1px, transparent 1px, transparent 46px);
    pointer-events: none;
  }

  .corner-web {
    position: absolute;
    width: 90px;
    height: 90px;
    z-index: 1;
    opacity: 0.4;
  }
  .corner-web.tl { top: -14px; left: 22px; }
  .corner-web.tr { top: -14px; right: 22px; transform: scaleX(-1); }
  .corner-web svg { width: 100%; height: 100%; }

  /* ===== DNA double-helix strands, left and right edges ===== */
  .dna-strand {
    position: absolute;
    top: 0;
    width: 30px;
    height: 100%;
    z-index: 1;
    opacity: 0.85;
  }
  .dna-strand.left  { left: 0; }
  .dna-strand.right { right: 0; transform: scaleX(-1); }
  .dna-strand svg { width: 100%; height: 100%; display: block; }

  .header {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 14px 0 0;
  }
  .header .brand {
    color: #d10000;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(209,0,0,0.5);
  }
  .header .sub {
    color: #666;
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* plain string down to the photo */
  .normal-thread {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 46px;
    z-index: 2;
  }
  .anchor-dot {
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #eee;
    box-shadow: 0 0 6px rgba(255,255,255,0.8);
  }
  .normal-thread svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .normal-thread .strand {
    stroke: #d9d9d9;
    stroke-width: 1.1;
    fill: none;
    filter: drop-shadow(0 0 1.5px rgba(255,255,255,0.4));
  }

  /* ===== small spiderman hanging in a web-shooting pose ===== */
  .mini-spidey {
    position: absolute;
    top: 34px;
    right: 20px;
    width: 76px;
    height: 108px;
    z-index: 2;
    transform-origin: 72% 2%;
    animation: mini-swing 4.4s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  @keyframes mini-swing {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(5deg); }
  }
  .mini-thread {
    stroke: #ddd;
    stroke-width: 1.1;
    fill: none;
  }
  .charge-ring {
    fill: none;
    stroke: #ff2d2d;
    stroke-width: 1;
    opacity: 0;
    transform-origin: center;
    animation: charge 1.6s ease-out infinite;
  }
  .charge-ring.r2 { animation-delay: 0.5s; }
  @keyframes charge {
    0%   { opacity: 0;   transform: scale(0.3); }
    40%  { opacity: 0.9; transform: scale(1);   }
    100% { opacity: 0;   transform: scale(1.7); }
  }
  .spark-dot {
    fill: #fff;
    opacity: 0.9;
    animation: spark-pulse 1.6s ease-in-out infinite;
  }
  @keyframes spark-pulse {
    0%, 100% { opacity: 0.5; r: 1.6; }
    50%      { opacity: 1;   r: 2.4; }
  }

  /* ===== small skill badges, top-left corner ===== */
  .skills {
    position: absolute;
    top: 48px;
    left: 12px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 64px;
  }
  .skill-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    background: rgba(20, 0, 0, 0.6);
    border: 1px solid rgba(196, 0, 0, 0.55);
    border-radius: 8px;
    color: #eee;
    font-size: 6.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.15;
    text-transform: uppercase;
    box-shadow: 0 0 6px rgba(196, 0, 0, 0.25);
    backdrop-filter: blur(1px);
  }
  .skill-badge .dot {
    flex: none;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff2d2d;
    box-shadow: 0 0 4px #ff2d2d;
  }

  /* ===== centered photo, blended into the black/red theme ===== */
  .avatar-wrap {
    position: relative;
    z-index: 2;
    width: 196px;
    margin: 74px auto 0;
  }
  .avatar-wrap::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 210px;
    height: 210px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(220,30,0,0.45), transparent 70%);
    filter: blur(6px);
    z-index: -1;
    animation: pulseGlow 3.2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1;   }
  }
  .avatar {
    width: 100%;
    display: block;
    mix-blend-mode: screen;
    filter: saturate(1.08) contrast(1.05) brightness(1.03)
            drop-shadow(0 0 10px rgba(255,40,10,0.35));
    mask-image: radial-gradient(circle at 50% 46%, #000 52%, transparent 76%);
    -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 52%, transparent 76%);
  }

  .id-block {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 3;
    padding: 14px 20px 18px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9) 45%);
    text-align: center;
  }
  .id-name {
    color: #f5f5f5;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0;
    text-shadow: 0 0 10px rgba(209,0,0,0.35);
  }
  .id-handle {
    color: #d10000;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 3px;
  }
  .id-role {
    color: #888;
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 8px;
    text-transform: uppercase;
  }
</style>
</head>
