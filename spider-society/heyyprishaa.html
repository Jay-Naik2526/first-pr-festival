<!--
  SPIDER-ID CARD — weave your own suit.

  RULES
  1. Rename this file to <your-github-username>.html
  2. Internal CSS only — keep it inside the <style> block below.
  3. No <script> tags. They are stripped and CI will reject them.
  4. Everything must fit inside 320 x 440. That's the card.
  5. Keep the four data- attributes on .spider-card — the roster reads them.

  Everything else is yours. Go wild.
-->
<div
  class="spider-card"
  data-name="Prisha Rathod"
  data-alias="Otto Octavirus"
  data-github="heyyprishaa"
  data-suit="#3A0D0D"
>
  <style>
    /* ── Your suit starts here ──────────────────────────────── */
    .spider-card {
      --suit: #ff007f;
      --cyber: #00f0ff;
      --ink: #07080e;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 22px;
      font-family: system-ui, sans-serif;
      color: #e8e6e3;
      background: radial-gradient(circle at 30% 0%, #2b031a, var(--ink) 75%);
      border: 2px solid var(--suit);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.15);
    }

    /* Webbing Overlay */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
          45deg,
          rgba(0, 240, 255, 0.05) 0 1px,
          transparent 1px 14px
        ),
        repeating-linear-gradient(-45deg, rgba(255, 0, 127, 0.05) 0 1px, transparent 1px 14px);
      pointer-events: none;
    }

    /* Chota Spider-Gwen Emblem on Bottom Right */
    .spider-card::after {
      content: "";
      position: absolute;
      bottom: 45px;
      right: 18px;
      width: 60px;
      height: 60px;
      background: url('https://api.iconify.design/simple-icons:spiderman.svg?color=%22ff007f') no-repeat center/contain;
      opacity: 0.8;
      filter: drop-shadow(0 0 6px var(--suit));
      pointer-events: none;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 2px solid var(--cyber);
      object-fit: cover;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
    }

    .alias {
      margin: 14px 0 2px;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 0.5px;
      color: var(--suit);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .name {
      margin: 0;
      font-size: 14px;
      opacity: 0.85;
      color: #ffffff;
    }

    .handle {
      margin-top: 4px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--cyber);
      opacity: 0.8;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
      padding: 0;
      list-style: none;
      position: relative;
      z-index: 1;
    }

    .skills li {
      padding: 5px 10px;
      font-size: 12px;
      border: 1px solid var(--cyber);
      border-radius: 999px;
      background: rgba(0, 240, 255, 0.1);
      color: #ffffff;
    }

    .skills li:first-child {
      border-color: var(--suit);
      background: rgba(255, 0, 127, 0.12);
    }

    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 10px;
      z-index: 1;
    }
  </style>

  <!-- Swap the username in this URL for your own -->
  <img class="avatar" src="https://github.com/spidery-priiee.png" alt="Prisha Rathod" />

  <h1 class="alias">@Otto Octavirus</h1>
  <p class="name">Prisha Rathod</p>
  <p class="handle">heyyprishaa</p>

  <ul class="skills">
    <li>Predator's Intuition</li>
    <li>Corrosive Silks</li>
    <li>Shadow Traversal</li>
  </ul>

  <div class="footer">
    <span>Spidery-Society</span>
    <span>Earth-1610</span>
  </div>
</div>
