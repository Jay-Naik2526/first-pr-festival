<!--
  SPIDER-ID CARD — shubhampraj1811
-->
<div
  class="spider-card"
  data-name="Shubham Prajapati"
  data-alias="Baburao"
  data-github="shubhampraj1811"
  data-suit="#d81920"
>
  <style>
    .spider-card {
      --suit: #d81920;
      --suit-bright: #ff3b30;
      --ember: #ff8a3d;
      --ink: #060608;
      --scale: rgba(255, 255, 255, 0.045);

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 24px 22px;
      font-family: system-ui, sans-serif;
      color: #e9e5df;
      background:
        radial-gradient(circle at 50% -10%, #1b1b20 0%, var(--ink) 55%, #000 100%);
      border: 1px solid #2a2a2e;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(60deg, var(--scale) 0 1px, transparent 1px 8px),
        repeating-linear-gradient(-60deg, var(--scale) 0 1px, transparent 1px 8px);
      pointer-events: none;
      z-index: 0;
    }

    .spider-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 18%, rgba(216, 25, 32, 0.35), transparent 42%),
        radial-gradient(ellipse at 50% 115%, rgba(216, 25, 32, 0.25), transparent 55%),
        linear-gradient(to bottom, transparent 60%, #000 100%);
      pointer-events: none;
      z-index: 0;
    }

    .tendrils {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 190px;
      height: 190px;
      z-index: 1;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(216, 25, 32, 0.55));
    }

    .embers span {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ember);
      box-shadow: 0 0 6px 1px var(--ember);
      opacity: 0;
      animation: drift 5.5s ease-in infinite;
      z-index: 1;
    }
    .embers span:nth-child(1) { left: 18px;  top: 300px; animation-delay: 0s; }
    .embers span:nth-child(2) { left: 250px; top: 340px; animation-delay: 1.1s; }
    .embers span:nth-child(3) { left: 60px;  top: 260px; animation-delay: 2.3s; }
    .embers span:nth-child(4) { left: 200px; top: 90px;  animation-delay: 3.1s; }
    .embers span:nth-child(5) { left: 280px; top: 220px; animation-delay: 0.6s; }
    .embers span:nth-child(6) { left: 120px; top: 380px; animation-delay: 2.8s; }

    @keyframes drift {
      0%   { opacity: 0; transform: translateY(0) scale(0.6); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-60px) translateX(8px) scale(1.1); }
    }

    .head {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-frame {
      position: relative;
      width: 78px;
      height: 78px;
      flex: none;
      border-radius: 13px;
      background: linear-gradient(145deg, #3a0a0e, #0b0b0c);
    }

    .avatar-frame::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 16px;
      background: conic-gradient(from 200deg, var(--suit-bright), var(--suit), #4a0509, var(--suit-bright));
      filter: blur(3px);
      opacity: 0.9;
      animation: spin 6s linear infinite;
      z-index: -1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 13px;
      object-fit: cover;
      display: block;
      filter: contrast(1.08) saturate(1.05);
      border: 2px solid #0b0b0c;
      background: linear-gradient(145deg, #3a0a0e, #0b0b0c);
    }

    .id-tag {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--suit-bright);
      opacity: 0.85;
    }

    .alias {
      position: relative;
      z-index: 2;
      margin: 18px 0 0;
      font-size: 34px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, var(--suit-bright) 70%, var(--suit) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 26px rgba(216, 25, 32, 0.35);
    }

    .name {
      position: relative;
      z-index: 2;
      margin: 6px 0 0;
      font-size: 13.5px;
      color: #cfcbc4;
    }

    .handle {
      position: relative;
      z-index: 2;
      margin-top: 3px;
      font-family: ui-monospace, monospace;
      font-size: 11.5px;
      color: var(--suit-bright);
      opacity: 0.75;
    }

    .emblem {
      position: absolute;
      right: 18px;
      bottom: 108px;
      width: 46px;
      height: 46px;
      z-index: 2;
      opacity: 0.95;
      filter: drop-shadow(0 0 8px rgba(255, 59, 48, 0.6));
    }

    .skills {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 20px;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 5px 11px;
      font-size: 11.5px;
      color: #f2e9e6;
      border: 1px solid rgba(216, 25, 32, 0.55);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(216, 25, 32, 0.22), rgba(216, 25, 32, 0.06));
    }

    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a8a49e;
      border-top: 1px solid rgba(216, 25, 32, 0.35);
      padding-top: 10px;
    }

    .footer strong {
      color: var(--suit-bright);
    }
  </style>

  <div class="embers">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <svg class="tendrils" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#d81920" stroke-width="7" stroke-linecap="round">

      <path d="M120 20 C 105 55, 150 60, 135 95" opacity="0.6"/>

  <div class="head">
    <div class="avatar-frame">
      <img
        class="avatar"
        src="https://github.com/shubhampraj1811.png?size=200"
        alt="Shubham Prajapati"
        loading="eager"
      />
    </div>
    <span class="id-tag">SPIDER&nbsp;ID // 1811</span>
  </div>

  <svg class="emblem" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <g fill="#d81920" stroke="#ff3b30" stroke-width="1">
      <ellipse cx="32" cy="34" rx="9" ry="13"/>
      <ellipse cx="32" cy="20" rx="5" ry="6"/>
      <path d="M32 22 L14 6 M32 22 L10 20 M32 22 L14 36" stroke-linecap="round" fill="none"/>
      <path d="M32 26 L54 10 M32 26 L58 24 M32 26 L54 40" stroke-linecap="round" fill="none"/>
      <path d="M32 40 L16 52 M32 44 L20 58" stroke-linecap="round" fill="none"/>
      <path d="M32 40 L48 52 M32 44 L44 58" stroke-linecap="round" fill="none"/>
    </g>
  </svg>

  <h1 class="alias">Totla Seth</h1>
  <p class="name">Shubham Prajapati</p>
  <p class="handle">@shubhampraj1811</p>

  <ul class="skills">
    <li>Web-Slinger</li>
    <li>Night Watch</li>
    <li>Wall Crawl</li>
  </ul>

  <div class="footer">
    <span>Spider-Society</span>
    <span><strong>Earth</strong>-1610</span>
  </div>
</div>
