<!--
  SPIDER-ID CARD — Vishwam / Spider-VRDXisback
  Miles Morales themed build

  Rules followed:
  1. Filename renamed to <github-username>.html (vishwamrajput.html)
  2. Internal CSS only, inside the <style> block below
  3. No <script> tags — all motion is pure CSS (hover/keyframes)
  4. Card fits exactly 320 x 440
  5. All four data- attributes kept on .spider-card
-->
<div
  class="spider-card"
  data-name="Vishwam"
  data-alias="Spider-VRDXisback"
  data-github="vishwamrajput"
  data-suit="#E0102B"
>
  <style>
    /* ── Miles Morales suit: matte black, blood red, glitch cyan ─ */
    .spider-card {
      --red: #e0102b;
      --red-deep: #7a0714;
      --glitch: #21e6ff;
      --ink: #060607;
      --paper: #f4f6ff;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 22px;
      font-family: 'Arial Black', Arial, system-ui, sans-serif;
      color: #ece9e6;
      background:
        radial-gradient(circle at 15% -10%, rgba(224, 16, 43, 0.28), transparent 55%),
        radial-gradient(circle at 105% 105%, rgba(33, 230, 255, 0.14), transparent 55%),
        var(--ink);
      border: 2px solid var(--red);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      box-shadow: 0 0 0 rgba(224, 16, 43, 0.4);
      transition: box-shadow 0.4s ease, transform 0.4s ease, border-color 0.4s ease;
    }

    .spider-card:hover {
      border-color: var(--glitch);
      box-shadow: 0 0 30px rgba(224, 16, 43, 0.55), 0 0 60px rgba(33, 230, 255, 0.3) inset;
      transform: translateY(-2px);
    }

    /* Comic halftone dot texture, faded top to bottom */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: radial-gradient(rgba(224, 16, 43, 0.35) 1px, transparent 1.4px);
      background-size: 10px 10px;
      mask-image: radial-gradient(circle at 50% 0%, #000 45%, transparent 90%);
      pointer-events: none;
    }

    /* Spray-can red glow, upper corner */
    .spider-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 240px;
      height: 240px;
      right: -90px;
      top: -90px;
      background: radial-gradient(circle, rgba(224, 16, 43, 0.55), transparent 70%);
      filter: blur(4px);
      animation: sense-pulse 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sense-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.18); }
    }

    /* Faint spray-painted spider watermark */
    .spider-mark {
      position: absolute;
      right: -18px;
      bottom: 30px;
      width: 150px;
      height: 150px;
      z-index: -1;
      opacity: 0.1;
      pointer-events: none;
    }

    .spider-mark path,
    .spider-mark ellipse {
      stroke: var(--red);
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .spider-mark ellipse {
      fill: var(--red);
      stroke: none;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrap {
      position: relative;
      width: 84px;
      height: 84px;
      flex-shrink: 0;
    }

    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--red), var(--ink) 60%, var(--glitch));
      opacity: 0.9;
    }

    /* ── Venom-strike: bio-electric strands thrown & pulled back ── */
    .web-fx {
      position: absolute;
      inset: 0;
      width: 320px;
      height: 440px;
      pointer-events: none;
      overflow: visible;
    }

    .web-strand {
      fill: none;
      stroke: var(--glitch);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 100;
      filter: drop-shadow(0 0 4px rgba(33, 230, 255, 0.85));
    }

    .strand-a {
      animation: strand-draw 4.6s ease-in-out infinite;
    }

    .strand-b {
      animation: strand-draw 4.6s ease-in-out infinite;
      animation-delay: -2.3s;
    }

    @keyframes strand-draw {
      0%, 8% { stroke-dashoffset: 100; }
      38% { stroke-dashoffset: 0; }
      56% { stroke-dashoffset: 0; }
      86%, 100% { stroke-dashoffset: 100; }
    }

    .web-ball {
      position: absolute;
      top: 0;
      left: 0;
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      background: var(--glitch);
      box-shadow: 0 0 9px 2px rgba(33, 230, 255, 0.9);
      opacity: 0;
      offset-rotate: 0deg;
    }

    .ball-a {
      offset-path: path("M64 64 L120 20 L170 48 L232 -6 L296 18");
      animation: ball-move 4.6s ease-in-out infinite;
    }

    .ball-b {
      offset-path: path("M64 68 L130 100 L180 60 L240 96 L300 78");
      animation: ball-move 4.6s ease-in-out infinite;
      animation-delay: -2.3s;
    }

    @keyframes ball-move {
      0%, 6% { offset-distance: 0%; opacity: 0; }
      12% { opacity: 1; }
      38% { offset-distance: 100%; opacity: 1; }
      56% { offset-distance: 100%; opacity: 1; }
      80% { opacity: 1; }
      86%, 100% { offset-distance: 0%; opacity: 0; }
    }

    .web-impact {
      fill: var(--glitch);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0 0 7px rgba(33, 230, 255, 0.95));
    }

    .impact-a {
      animation: impact-pulse 4.6s ease-in-out infinite;
    }

    .impact-b {
      animation: impact-pulse 4.6s ease-in-out infinite;
      animation-delay: -2.3s;
    }

    @keyframes impact-pulse {
      0%, 36% { opacity: 0; transform: scale(0.2); }
      40% { opacity: 0.9; transform: scale(1.5); }
      50% { opacity: 0.5; transform: scale(1); }
      58%, 100% { opacity: 0; transform: scale(0.2); }
    }

    .avatar {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      object-fit: cover;
      display: block;
      background: #0d0e11;
      filter: grayscale(0.15) contrast(1.05);
    }

    .id-block {
      display: flex;
      flex-direction: column;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--glitch);
      opacity: 0.95;
    }

    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--glitch);
      box-shadow: 0 0 8px var(--glitch);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .handle {
      margin-top: 3px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      opacity: 0.6;
    }

    .alias {
      position: relative;
      margin: 16px 0 2px;
      font-size: 23px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--paper);
      text-shadow:
        2px 0 0 rgba(224, 16, 43, 0.85),
        -2px 0 0 rgba(33, 230, 255, 0.7);
      animation: glitch-jitter 5.5s steps(1) infinite;
    }

    @keyframes glitch-jitter {
      0%, 92%, 100% {
        text-shadow:
          2px 0 0 rgba(224, 16, 43, 0.85),
          -2px 0 0 rgba(33, 230, 255, 0.7);
        transform: translateX(0);
      }
      93% {
        text-shadow:
          -3px 0 0 rgba(224, 16, 43, 0.9),
          3px 1px 0 rgba(33, 230, 255, 0.8);
        transform: translateX(-1px);
      }
      95% {
        text-shadow:
          3px -1px 0 rgba(224, 16, 43, 0.9),
          -3px 0 0 rgba(33, 230, 255, 0.8);
        transform: translateX(1px);
      }
      97% {
        text-shadow:
          2px 0 0 rgba(224, 16, 43, 0.85),
          -2px 0 0 rgba(33, 230, 255, 0.7);
        transform: translateX(0);
      }
    }

    .name {
      margin: 0;
      font-size: 14px;
      opacity: 0.75;
      font-family: system-ui, sans-serif;
    }

    .tagline {
      margin-top: 10px;
      font-size: 11.5px;
      line-height: 1.5;
      opacity: 0.8;
      font-family: system-ui, sans-serif;
      border-left: 2px solid var(--red);
      padding-left: 10px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
      padding: 0;
      list-style: none;
      font-family: system-ui, sans-serif;
    }

    .skills li {
      padding: 5px 10px;
      font-size: 11.5px;
      border: 1px solid var(--red);
      border-radius: 999px;
      background: rgba(224, 16, 43, 0.14);
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .skills li:nth-child(even) {
      border-color: var(--glitch);
      background: rgba(33, 230, 255, 0.1);
    }

    .skills li:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(224, 16, 43, 0.6);
    }

    .skills li:nth-child(even):hover {
      box-shadow: 0 0 12px rgba(33, 230, 255, 0.6);
    }

    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.55;
      border-top: 1px solid rgba(224, 16, 43, 0.35);
      padding-top: 10px;
    }

    .footer span:last-child {
      color: var(--red);
      opacity: 0.95;
    }
  </style>
