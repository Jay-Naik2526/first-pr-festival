-->

  <style>
    /* ── Your suit starts here ──────────────────────────────── */
    .spider-card {
      --suit: #e62429;
      --suit-glow: rgba(230, 36, 41, 0.55);
      --ink: #08080a;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 22px;
      font-family: system-ui, sans-serif;
      color: #e8e6e3;
      background:
        radial-gradient(circle at 22% -6%, rgba(230, 36, 41, 0.35), transparent 42%),
        radial-gradient(circle at 78% 4%, rgba(230, 36, 41, 0.22), transparent 38%),
        radial-gradient(circle at 50% 60%, #1a0306, var(--ink) 75%);
      border: 2px solid var(--suit);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(230, 36, 41, 0.25),
        0 0 34px var(--suit-glow),
        inset 0 0 60px rgba(0, 0, 0, 0.55);
      animation: pulse-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(230, 36, 41, 0.25),
          0 0 28px var(--suit-glow),
          inset 0 0 60px rgba(0, 0, 0, 0.55);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(230, 36, 41, 0.4),
          0 0 46px var(--suit-glow),
          inset 0 0 60px rgba(0, 0, 0, 0.55);
      }
    }

    /* Fine grain + vignette for a cinematic finish */
    .spider-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Webbing, drawn with two repeating gradients across the whole card */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.05) 0 1px,
          transparent 1px 14px
        ),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 14px);
      pointer-events: none;
    }

    /* Radial spider web tucked into the top-left corner */
    .corner-web {
      position: absolute;
      top: -18px;
      left: -18px;
      width: 150px;
      height: 150px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* Radial spider web tucked into the top-right corner */
    .corner-web-right {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 130px;
      height: 130px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* Red spider dangling from the top-right web */
    .hanging-spider {
      position: absolute;
      top: 0;
      right: 46px;
      width: 30px;
      height: 74px;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 0 6px rgba(230, 36, 41, 0.65));
    }

    /* Faint spider silhouette watermark in bottom-right open space */
    .watermark-spider {
      position: absolute;
      bottom: -14px;
      right: -14px;
      width: 130px;
      height: 130px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    /* Original spider emblem badge, bottom-left corner */
    .emblem-spider {
      position: absolute;
      bottom: 46px;
      left: 18px;
      width: 38px;
      height: 38px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.95;
      filter: drop-shadow(0 0 5px rgba(230, 36, 41, 0.6));
    }

    .alias {
      margin: 30px 0 2px;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: 0.5px;
      color: #ff3b41;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(230, 36, 41, 0.9),
        0 0 22px rgba(230, 36, 41, 0.6),
        0 0 44px rgba(230, 36, 41, 0.35);
      position: relative;
      z-index: 3;
    }

    .name {
      margin: 0;
      font-size: 14px;
      opacity: 0.75;
      position: relative;
      z-index: 2;
    }

    .handle {
      margin-top: 4px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      opacity: 0.55;
      position: relative;
      z-index: 2;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
      padding: 0;
      list-style: none;
      position: relative;
      z-index: 2;
    }

    .skills li {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ffe6e6;
      border: 1px solid rgba(230, 36, 41, 0.7);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(230, 36, 41, 0.28), rgba(230, 36, 41, 0.08));
      box-shadow: 0 0 10px rgba(230, 36, 41, 0.25);
    }

    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid rgba(230, 36, 41, 0.35);
      padding-top: 10px;
      z-index: 2;
    }

    .footer span:first-child {
      color: #ff6a6d;
      opacity: 0.85;
    }

    .footer span:last-child {
      opacity: 0.4;
    }
  </style>
