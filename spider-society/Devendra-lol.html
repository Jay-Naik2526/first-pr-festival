<!--
  SPIDER-ID CARD — weave your own suit.

  RULES
  1. Rename this file to Devendra-lol.html
  2. Internal CSS only — keep it inside the <style> block below.
  3. No <script> tags. They are stripped and CI will reject them.
  4. Everything must fit inside 320 x 440. That's the card.
  5. Keep the four data- attributes on .spider-card — the roster reads them.
-->
<div
  class="spider-card"
  data-name="Devendra Swapnil Narvekar"
  data-alias="GROOT"
  data-github="Devendra-lol"
  data-suit="#FF003C"
>
  <style>
    /* ── High-Tech Advanced Suit Theme ────────────────────────────── */
    .spider-card {
      --suit-primary: #FF003C;
      --suit-accent: #00F0FF;
      --suit-dark: #08080A;
      --text-main: #FFFFFF;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 24px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: var(--text-main);
      background-color: var(--suit-dark);
      background-image:
        linear-gradient(45deg, #111 25%, transparent 25%), 
        linear-gradient(-45deg, #111 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #111 75%),
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 4px 4px;
      background-position: 0 0, 0 2px, 2px 2px, 2px 0;
      
      border: 1px solid #333;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .spider-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: -50px;
      width: 200px;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 0, 60, 0.1),
        rgba(255, 0, 60, 0.1) 2px,
        transparent 2px,
        transparent 4px
      );
      transform: skewX(-15deg);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid var(--suit-primary);
      box-shadow: 4px 4px 0px var(--suit-primary), -4px -4px 0px var(--suit-accent);
      overflow: hidden;
      background: #fff;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta-bar {
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 8px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .alias {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      font-style: italic;
      color: var(--suit-primary);
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 4px;
    }

    .name {
      margin: 0;
      font-size: 16px;
      font-weight: 300;
      color: #ccc;
    }

    .handle {
      margin: 2px 0 0 0;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 12px;
      color: #666;
    }

    .skills {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
      padding: 0;
      list-style: none;
    }

    .skills li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #222;
      border-radius: 8px;
    }
    
    .skill-icon {
      width: 20px;
      height: 20px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: bold;
      color: var(--suit-accent);
      border: 1px solid #333;
    }

    .footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #444;
      padding-top: 15px;
    }
    
    .spider-logo-bg {
      position: absolute;
      bottom: -30px;
      right: -30px;
      font-size: 160px;
      color: rgba(255, 255, 255, 0.02);
      z-index: 1;
      user-select: none;
    }
  </style>

  <div class="spider-logo-bg">🕷</div>

  <div class="content-wrapper">
    <div class="meta-bar">name | alias | github | suit</div>

      />
    </div>

    <h1 class="alias">GROOT</h1>
    <p class="name">Devendra Swapnil Narvekar</p>
    <p class="handle">@Devendra-lol</p>

    <ul class="skills">
      <li><div class="skill-icon">Py</div>Python</li>
      <li><div class="skill-icon">C</div>C Programming</li>
      <li><div class="skill-icon">CAD</div>AutoCAD</li>
    </ul>

    <div class="footer">
      <span>Spider-Society</span>
      <span>Earth-1610</span>
    </div>
  </div>
</div>
