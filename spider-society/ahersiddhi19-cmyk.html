<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spider Card - Danny Elfman Theme</title>
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #050608;
      font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
    }

    /* Fixed 320x440 dimensions per Rule #4 */
    .spider-card {
      width: 320px;
      height: 440px;
      background: radial-gradient(circle at 50% 30%, #1a0507 0%, #08090c 70%, #000000 100%);
      border: 2px solid #8a151b;
      border-radius: 8px;
      padding: 18px;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 25px rgba(138, 21, 27, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Subtle CSS web overlay effect */
    .spider-card::before {
      content: "";
      position: absolute;
      top: -50px;
      left: -50px;
      width: 420px;
      height: 540px;
      background: 
        radial-gradient(circle, transparent 40%, rgba(255,255,255,0.03) 41%, transparent 42%),
        conic-gradient(from 0deg at 50% 40%, rgba(255,255,255,0.05) 0deg, transparent 15deg, rgba(255,255,255,0.05) 30deg, transparent 45deg);
      pointer-events: none;
    }

    /* Header Styling */
    .card-header {
      border-bottom: 1px solid rgba(224, 224, 224, 0.15);
      padding-bottom: 8px;
      text-align: center;
      z-index: 1;
    }

    .card-title {
      font-size: 1.35rem;
      color: #d1232a;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(209, 35, 42, 0.5);
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 0.75rem;
      color: #a3a8b5;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Body & Emblem */
    .card-body {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;
      margin: 10px 0;
    }

    .raimi-emblem {
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #181a20, #0c0d12);
      border: 1px solid #4a5061;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 0 6px rgba(255,255,255,0.1);
      margin-bottom: 12px;
    }

    .emblem-icon {
      font-size: 1.8rem;
      color: #c0c0c0;
      text-shadow: 0 0 5px rgba(255,255,255,0.4);
    }

    .theme-quote {
      font-size: 0.78rem;
      font-style: italic;
      color: #b8bac4;
      line-height: 1.3;
      padding: 0 10px;
    }

    /* Score Metadata / Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      background: rgba(10, 12, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 4px;
      z-index: 1;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.62rem;
      color: #7a8091;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 0.82rem;
      font-weight: 600;
      color: #e0e0e0;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Rule #5: All 4 data-attributes preserved -->
  <div 
    class="spider-card" 
    data-name="Dr Doom" 
    data-alias="Dr Doomg" 
    data-power="100" 
    data-universe="Earth-96283"
  >
    <div class="card-header">
      <h1 class="card-title">Spider-Man</h1>
      <span class="card-subtitle">Score by Danny Elfman</span>
    </div>

    <div class="card-body">
      <div class="raimi-emblem">
        <span class="emblem-icon">🕷</span>
      </div>
      <p class="theme-quote">"Main Titles / Responsibility Theme"<br><span style="font-size: 0.68rem; color: #7a8091;">2002 Original Motion Picture Soundtrack</span></p>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Composer</span>
        <span class="stat-value">D. Elfman</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Universe</span>
        <span class="stat-value">Raimi-Verse</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Key Signature</span>
        <span class="stat-value">G Minor</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Power Level</span>
        <span class="stat-value">100</span>
      </div>
    </div>
  </div>

</body>
</html>
