<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spider-Man Card</title>
<style>
  :root{
    --red: #ff2d2d;
    --deep-red: #7a0d10;
    --blue: #234ac9;
    --deep-blue: #070d24;
    --web: rgba(255,255,255,0.20);
    --gold: #ffd45e;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#020207;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
  }

  .stage{ width:320px; height:440px; perspective: 1000px; }

  /* ================= CARD SHELL ================= */
  .spider-card{
    position:relative;
    width:320px; height:440px;
    border-radius:18px;
    overflow:hidden;
    background:
      radial-gradient(circle at 25% 15%, rgba(255,60,60,0.4), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(40,90,220,0.4), transparent 50%),
      linear-gradient(160deg, var(--deep-blue) 0%, #12061e 55%, var(--deep-red) 135%);
    background-size: 220% 220%, 220% 220%, 100% 100%;
    animation: floatCard 5.5s ease-in-out infinite, bgDrift 9s ease-in-out infinite;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.07) inset, 0 0 30px rgba(230,36,41,0.4), 0 20px 45px rgba(0,0,0,0.6);
    transition: transform .35s ease, box-shadow .35s ease;
    cursor:pointer;
  }
  .stage:hover .spider-card{
    transform: rotateX(5deg) rotateY(-7deg) scale(1.025);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.14) inset, 0 0 65px rgba(230,36,41,0.75), 0 26px 55px rgba(0,0,0,0.65);
  }
  @keyframes floatCard{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
  @keyframes bgDrift{
    0%,100%{ background-position: 0% 0%, 100% 100%, 0 0; }
    50%{ background-position: 30% 20%, 70% 80%, 0 0; }
  }

  /* animated holographic border ring */
  .holo-border{
    position:absolute; inset:0;
    border-radius:18px;
    padding:2px;
    background: conic-gradient(from 0deg, var(--red), var(--gold), var(--blue), #ff2d2d, var(--gold), var(--red));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotateHolo 4s linear infinite;
    opacity:0.85;
    z-index:4;
    pointer-events:none;
  }
  @keyframes rotateHolo{ to{ transform: rotate(360deg); } }

  /* ================= WEB TEXTURE ================= */
  .web-lines{
    position:absolute; inset:0; opacity:0.5;
    background-image:
      repeating-linear-gradient(115deg, var(--web) 0px, var(--web) 1px, transparent 1px, transparent 30px),
      repeating-linear-gradient(25deg, var(--web) 0px, var(--web) 1px, transparent 1px, transparent 30px);
    mix-blend-mode: overlay;
    animation: webDrift 8s linear infinite;
  }
  @keyframes webDrift{ 0%{background-position:0 0,0 0;} 100%{background-position:140px 70px,-140px 70px;} }

  .radial-web{
    position:absolute; top:-70px; left:50%;
    width:340px; height:340px; transform:translateX(-50%);
    opacity:0.25;
    background:
      repeating-conic-gradient(from 0deg, var(--web) 0deg 1.1deg, transparent 1.1deg 13deg),
      repeating-radial-gradient(circle, transparent 0 22px, var(--web) 22px 23px);
    border-radius:50%;
    animation: spin 30s linear infinite;
  }
  @keyframes spin{ to{ transform:translateX(-50%) rotate(360deg); } }

  /* shockwave rings pulsing from emblem */
  .shock{
    position:absolute;
    top:120px; left:50%;
    width:20px; height:20px;
    margin-left:-10px;
    border:2px solid rgba(255,80,80,0.65);
    border-radius:50%;
    animation: shockwave 2.6s ease-out infinite;
    z-index:1;
  }
  .shock:nth-child(2){ animation-delay:0.9s; }
  .shock:nth-child(3){ animation-delay:1.8s; }
  @keyframes shockwave{
    0%{ width:20px; height:20px; margin-left:-10px; margin-top:0; opacity:0.8; border-color: rgba(255,120,80,0.75); }
    100%{ width:200px; height:200px; margin-left:-100px; margin-top:-90px; opacity:0; border-color: rgba(255,80,80,0); }
  }

  /* floating spark particles */
  .particle{
    position:absolute;
    bottom:-10px;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--gold);
    box-shadow:0 0 6px var(--gold);
    opacity:0;
    animation: floatUp linear infinite;
    z-index:2;
  }
  .particle:nth-child(4){ left:12%; animation-duration:5s; animation-delay:0.2s; }
  .particle:nth-child(5){ left:28%; animation-duration:6.5s; animation-delay:1.5s; background:var(--red); box-shadow:0 0 6px var(--red);}
  .particle:nth-child(6){ left:48%; animation-duration:5.8s; animation-delay:0.8s; }
  .particle:nth-child(7){ left:65%; animation-duration:7s; animation-delay:2.4s; background:var(--red); box-shadow:0 0 6px var(--red);}
  .particle:nth-child(8){ left:80%; animation-duration:5.2s; animation-delay:1.1s; }
  .particle:nth-child(9){ left:92%; animation-duration:6.2s; animation-delay:3s; background:var(--red); box-shadow:0 0 6px var(--red);}
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translateY(-220px) scale(1); opacity:0.9;}
    90%{ opacity:0.3; }
    100%{ transform:translateY(-460px) scale(0.4); opacity:0; }
  }

  /* swinging silhouette on a thread across the top */
  .swinger{
    position:absolute;
    top:0; left:-40px;
    width:14px; height:120px;
    z-index:3;
    animation: swing 4.5s ease-in-out infinite;
    transform-origin: top center;
    pointer-events:none;
  }
  .swinger .thread{
    position:absolute; top:0; left:50%; width:1px; height:70px;
    background: rgba(255,255,255,0.55);
    transform:translateX(-50%);
  }
  .swinger .body{
    position:absolute; top:66px; left:50%;
    width:12px; height:16px; transform:translateX(-50%);
    background: linear-gradient(160deg, var(--red), var(--deep-red));
    border-radius: 40% 40% 50% 50%;
    box-shadow:0 0 8px rgba(255,45,45,0.7);
  }
  @keyframes swing{
    0%{ left:-40px; transform: rotate(-18deg); }
    50%{ left:250px; transform: rotate(18deg); }
    100%{ left:-40px; transform: rotate(-18deg); }
  }

  .vignette{ position:absolute; inset:0; box-shadow: inset 0 0 90px rgba(0,0,0,0.68); pointer-events:none; z-index:5;}

  .sheen{
    position:absolute; top:0; left:-160%;
    width:55%; height:100%;
    background: linear-gradient(75deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: sheenMove 4.2s ease-in-out infinite;
    pointer-events:none; z-index:3;
  }
  @keyframes sheenMove{ 0%{left:-60%;} 45%{left:135%;} 100%{left:135%;} }

  /* ================= HEADER ================= */
  .card-header{
    position:relative; z-index:6;
    padding:14px 16px 0 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .rank-badge{
    background: linear-gradient(145deg, var(--gold), #a9761f);
    color:#2a1400; font-weight:800; font-size:13px; letter-spacing:1px;
    padding:4px 10px; border-radius:8px;
    box-shadow:0 0 12px rgba(255,212,94,0.6), 0 2px 3px rgba(0,0,0,0.4);
    animation: badgePulse 2s ease-in-out infinite, badgeWiggle 3.4s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes badgePulse{ 0%,100%{ box-shadow:0 0 8px rgba(255,212,94,0.45),0 2px 3px rgba(0,0,0,0.4);} 50%{ box-shadow:0 0 22px rgba(255,212,94,0.95),0 2px 3px rgba(0,0,0,0.4);} }
  @keyframes badgeWiggle{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-3deg);} }

  .city-tag{
    font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.7);
    text-transform:uppercase; margin-top:4px; position:relative;
  }
  .city-tag::after{
    content:""; position:absolute; left:0; bottom:-3px; height:1px; width:100%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: underlineSweep 2.8s ease-in-out infinite;
  }
  @keyframes underlineSweep{ 0%,100%{ opacity:0.2;} 50%{ opacity:1;} }

  /* ================= EMBLEM ================= */
  .emblem-wrap{ position:relative; z-index:2; display:flex; justify-content:center; margin-top:2px; }
  .emblem-glow{
    position:absolute; width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, rgba(230,36,41,0.6), transparent 70%);
    filter: blur(6px);
    animation: glowPulse 2.2s ease-in-out infinite;
  }
  @keyframes glowPulse{ 0%,100%{opacity:0.55; transform:scale(1);} 50%{opacity:1; transform:scale(1.18);} }

  .spider-emblem{
    position:relative; width:112px; height:112px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    animation: crawl 2.8s ease-in-out infinite;
  }
  @keyframes crawl{
    0%,100%{ transform: translateY(0) rotate(0deg) scale(1); }
    25%{ transform: translateY(-4px) rotate(-3deg) scale(1.02); }
    50%{ transform: translateY(-2px) rotate(3deg) scale(1.05); }
    75%{ transform: translateY(-5px) rotate(-2deg) scale(1.02); }
  }

  /* ================= NAME ================= */
  .name-plate{ position:relative; z-index:6; text-align:center; margin-top:2px; }
  .hero-name{
    margin:0; font-size:23px; font-weight:900; letter-spacing:2px;
    color:#fff; text-transform:uppercase;
  }
  .hero-name span{
    display:inline-block;
    text-shadow:0 0 6px rgba(230,36,41,0.9), 0 0 16px rgba(230,36,41,0.6), 0 2px 2px rgba(0,0,0,0.6);
    animation: letterWave 2.4s ease-in-out infinite;
  }
  .hero-name span:nth-child(1){ animation-delay:0.00s; }
  .hero-name span:nth-child(2){ animation-delay:0.06s; }
  .hero-name span:nth-child(3){ animation-delay:0.12s; }
  .hero-name span:nth-child(4){ animation-delay:0.18s; }
  .hero-name span:nth-child(5){ animation-delay:0.24s; }
  .hero-name span:nth-child(6){ animation-delay:0.30s; }
  .hero-name span:nth-child(7){ animation-delay:0.36s; }
  .hero-name span:nth-child(8){ animation-delay:0.42s; }
  .hero-name span:nth-child(9){ animation-delay:0.48s; }
  .hero-name span:nth-child(10){ animation-delay:0.54s; }
  @keyframes letterWave{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }

  .alter-ego{
    margin:2px 0 0 0; font-size:11px; letter-spacing:3px;
    color:rgba(255,255,255,0.6); text-transform:uppercase;
  }

  /* ================= STATS ================= */
  .stats{ position:relative; z-index:6; margin:12px 20px 0 20px; display:flex; flex-direction:column; gap:8px; }
  .stat-row{ display:flex; align-items:center; gap:8px; }
  .stat-label{ width:82px; font-size:10px; letter-spacing:1px; color:rgba(255,255,255,0.78); text-transform:uppercase; }
  .stat-bar{ flex:1; height:7px; border-radius:5px; background:rgba(255,255,255,0.14); overflow:hidden; position:relative; }
  .stat-fill{
    position:relative; height:100%; border-radius:5px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
    background-size:250% 100%;
    animation: fillGlow 2.2s linear infinite, growBar 1.2s ease-out;
    box-shadow:0 0 9px rgba(230,36,41,0.75);
  }
  .stat-fill::after{
    content:""; position:absolute; top:0; left:-40%; width:30%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: shimmerBar 1.8s ease-in-out infinite;
  }
  @keyframes shimmerBar{ 0%{ left:-40%;} 100%{ left:130%;} }
  @keyframes fillGlow{ 0%{background-position:0% 0;} 100%{background-position:250% 0;} }
  @keyframes growBar{ from{ width:0%; } }
  .s1{ width:96%; } .s2{ width:90%; } .s3{ width:98%; } .s4{ width:80%; }

  /* ================= QUOTE + FOOTER ================= */
  .quote{
    position:relative; z-index:6; margin:14px 18px 0 18px; padding-top:9px;
    border-top:1px dashed rgba(255,255,255,0.28);
    font-size:10.5px; line-height:1.4; text-align:center;
    color:rgba(255,255,255,0.82); font-style:italic;
  }

  .footer-strip{
    position:absolute; bottom:0; left:0; right:0; z-index:6;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 16px;
    background:linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
    font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,0.6); text-transform:uppercase;
  }
  .pulse-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--red); box-shadow:0 0 6px var(--red);
    animation: dotPulse 1.3s ease-in-out infinite;
  }
  @keyframes dotPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.7); opacity:0.5; } }
</style>
</head>
<body>

  <div class="stage">
    <div class="spider-card"
         data-hero="Spider-Man"
         data-city="New York"
         data-power="Wall-Crawling / Spider-Sense"
         data-rank="S+">

      <div class="radial-web"></div>
      <div class="web-lines"></div>

      <div class="shock"></div>
      <div class="shock"></div>
      <div class="shock"></div>

      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>

      <div class="swinger">
        <div class="thread"></div>
        <div class="body"></div>
      </div>

      <div class="sheen"></div>
      <div class="holo-border"></div>

      <div class="card-header">
        <span class="rank-badge">RANK S+</span>
        <span class="city-tag">New&nbsp;York</span>
      </div>

      <div class="emblem-wrap">
        <div class="emblem-glow"></div>
        <svg class="spider-emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4b4f"/>
              <stop offset="100%" stop-color="#8f0e12"/>
            </linearGradient>
          </defs>
          <g stroke="url(#body-grad)" stroke-width="3.4" stroke-linecap="round" fill="none">
            <path d="M50 40 L18 18"/>
            <path d="M50 45 L10 40"/>
            <path d="M50 52 L10 60"/>
            <path d="M50 58 L18 82"/>
            <path d="M50 40 L82 18"/>
            <path d="M50 45 L90 40"/>
            <path d="M50 52 L90 60"/>
            <path d="M50 58 L82 82"/>
          </g>
          <ellipse cx="50" cy="34" rx="9" ry="11" fill="url(#body-grad)"/>
          <ellipse cx="50" cy="58" rx="14" ry="20" fill="url(#body-grad)"/>
          <ellipse cx="50" cy="58" rx="14" ry="20" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
        </svg>
      </div>

      <div class="name-plate">
        <p class="hero-name">
          <span>S</span><span>P</span><span>I</span><span>D</span><span>E</span><span>R</span><span>-</span><span>M</span><span>A</span><span>N</span>
        </p>
        <p class="alter-ego">Peter&nbsp;B.&nbsp;Parker</p>
      </div>

      <div class="stats">
        <div class="stat-row">
          <span class="stat-label">Agility</span>
          <div class="stat-bar"><div class="stat-fill s1"></div></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Strength</span>
          <div class="stat-bar"><div class="stat-fill s2"></div></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Spider-Sense</span>
          <div class="stat-bar"><div class="stat-fill s3"></div></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Web Fluid</span>
          <div class="stat-bar"><div class="stat-fill s4"></div></div>
        </div>
      </div>

      <p class="quote">&ldquo;With great power comes great responsibility.&rdquo;</p>

      <div class="footer-strip">
        <span>Daily Bugle Files</span>
        <span class="pulse-dot"></span>
      </div>

      <div class="vignette"></div>
    </div>
  </div>

</body>
</html>
