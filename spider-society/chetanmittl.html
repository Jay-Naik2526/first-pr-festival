<!--
  SPIDER-ID CARD — weave your own suit.

  RULES
  1. Rename this file to <your-github-username>.html
  2. Internal CSS only — keep it inside the <style> block below.
  3. No <script> tags. They are stripped and CI will reject them.
  4. Everything must fit inside 320 x 440. That's the card.
  5. Keep the four data- attributes on .spider-card — the roster reads them.

  Everything else is yours. Go wild.
-->
<div
  class="spider-card"
  data-name="Chetan Mittal"
  data-alias="Cyber-Weaver"
  data-github="chetanmittal"
  data-suit="#00f3ff"
>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap');

    @keyframes radar-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.16; }
      50% { transform: scale(1.05) rotate(4deg); opacity: 0.28; }
    }

    @keyframes chromatic-glitch {
      0%, 88%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }
      89% {
        clip-path: inset(16% 0 60% 0);
        transform: translate(-3px, 1.5px);
      }
      91% {
        clip-path: inset(62% 0 16% 0);
        transform: translate(3px, -1.5px);
      }
      93% {
        clip-path: inset(82% 0 4% 0);
        transform: translate(-2px, 2px);
      }
    }

    @keyframes scanline-sweep {
      0% { transform: translateY(-30px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(440px); opacity: 0; }
    }

    @keyframes holographic-foil {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes pulse-bar {
      0%, 100% { height: 3px; }
      50% { height: 12px; }
    }

    .spider-card {
      --suit: #00f3ff;
      --accent: #ff0055;
      --gold: #ffe600;
      --ink: #03050a;
      --panel: rgba(8, 14, 28, 0.78);
      --glass-border: rgba(0, 243, 255, 0.28);

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 18px 18px 14px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #e6edf3;
      background: radial-gradient(circle at 85% 12%, rgba(0, 243, 255, 0.2), transparent 48%),
                  radial-gradient(circle at 10% 88%, rgba(255, 0, 85, 0.16), transparent 48%),
                  linear-gradient(175deg, #070c18 0%, var(--ink) 100%);
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(0, 243, 255, 0.22),
                  inset 0 0 22px rgba(0, 243, 255, 0.08);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.35s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    /* Tactile 3D Hover & Holographic Light Glare */
    .spider-card:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: rgba(0, 243, 255, 0.85);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.9),
                  0 0 45px rgba(0, 243, 255, 0.45),
                  0 0 25px rgba(255, 0, 85, 0.3),
                  inset 0 0 28px rgba(0, 243, 255, 0.16);
    }

    .card-foil-glare {
      position: absolute;
      inset: -50%;
      background: linear-gradient(
        125deg,
        transparent 35%,
        rgba(0, 243, 255, 0.15) 45%,
        rgba(255, 0, 85, 0.15) 55%,
        transparent 65%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translateX(-40%) translateY(-40%);
      z-index: 5;
    }

    .spider-card:hover .card-foil-glare {
      opacity: 1;
      transform: translateX(10%) translateY(10%);
    }

    /* Comic Halftone Pattern */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 243, 255, 0.12) 1.1px, transparent 1.1px);
      background-size: 7px 7px;
      pointer-events: none;
      z-index: 1;
    }

    /* Bi-Directional Scanner Beam */
    .spider-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--suit), var(--accent), transparent);
      box-shadow: 0 0 14px var(--suit);
      animation: scanline-sweep 5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 6;
    }

    /* HUD Corner Targeting Reticles */
    .corner-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--suit);
      pointer-events: none;
      z-index: 4;
      opacity: 0.75;
      transition: border-color 0.3s ease, opacity 0.3s ease;
    }
    .spider-card:hover .corner-bracket {
      opacity: 1;
      border-color: var(--accent);
    }
    .cb-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .cb-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .cb-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .cb-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    /* Concentric Radar Silk Web */
    .radar-web {
      position: absolute;
      right: -55px;
      top: 25px;
      width: 250px;
      height: 250px;
      pointer-events: none;
      animation: radar-pulse 8s ease-in-out infinite;
      z-index: 0;
    }

    /* Top HUD Clearance Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 3;
      margin-bottom: 12px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .clearance-tag {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid var(--accent);
      color: #ff5588;
      padding: 2px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.35);
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
    }

    .multiverse-id {
      color: var(--suit);
      opacity: 0.85;
      letter-spacing: 1.8px;
    }

    /* Visual Header Row */
    .profile-row {
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
      z-index: 3;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(0, 243, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      flex-shrink: 0;
      background: #080e1b;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .spider-card:hover .avatar-wrapper {
      transform: scale(1.04);
      border-color: var(--suit);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.1) brightness(0.95);
    }

    .avatar-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0, 243, 255, 0.35) 100%),
                  radial-gradient(circle, transparent 60%, rgba(3, 5, 10, 0.6) 100%);
      pointer-events: none;
    }

    .spider-crest-panel {
      flex: 1;
      height: 80px;
      background: var(--panel);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: inset 0 0 14px rgba(0, 243, 255, 0.05);
    }

    .crest-icon {
      width: 48px;
      height: 48px;
      fill: var(--suit);
      filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8));
    }

    .stat-readouts {
      text-align: right;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .stat-readouts span {
      display: block;
      font-size: 10px;
      color: #7b8ba5;
      letter-spacing: 1.2px;
      font-weight: 600;
    }

    .stat-readouts b {
      display: block;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    /* Live Telemetry Wave Equalizer */
    .telemetry-wave {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 2.5px;
      height: 12px;
      margin-top: 3px;
    }

    .telemetry-wave span {
      width: 2px;
      background: var(--suit);
      border-radius: 1px;
      box-shadow: 0 0 4px var(--suit);
      animation: pulse-bar 1.2s ease-in-out infinite;
    }

    .telemetry-wave span:nth-child(1) { animation-delay: 0.1s; }
    .telemetry-wave span:nth-child(2) { animation-delay: 0.4s; }
    .telemetry-wave span:nth-child(3) { animation-delay: 0.2s; }
    .telemetry-wave span:nth-child(4) { animation-delay: 0.6s; }

    /* Identity Section */
    .identity-block {
      margin-top: 13px;
      position: relative;
      z-index: 3;
    }

    .alias {
      margin: 0;
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 23px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 1.5px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px var(--accent), -1.5px -1.5px 0px var(--suit);
      animation: chromatic-glitch 5s infinite;
    }

    .name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 4px;
    }

    .civ-name {
      margin: 0;
      font-size: 13.5px;
      font-weight: 700;
      color: #dbeafe;
      letter-spacing: 0.6px;
    }

    .handle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--suit);
      letter-spacing: 1.2px;
    }

    /* Interactive Cyber-Arsenal Skills Matrix */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      position: relative;
      z-index: 3;
    }

    .skills-grid li {
      padding: 6px 8px;
      font-size: 10.5px;
      font-family: 'Rajdhani', monospace, sans-serif;
      font-weight: 700;
      color: #e2e8f0;
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 8px;
      background: rgba(7, 13, 26, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .skills-grid li:hover {
      border-color: var(--suit);
      background: rgba(0, 243, 255, 0.15);
      color: #ffffff;
      transform: translateY(-1.5px);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.35);
    }

    .skill-sigil {
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--suit);
      box-shadow: 0 0 6px var(--suit);
      flex-shrink: 0;
      transition: background-color 0.25s ease;
    }

    .skills-grid li:first-child {
      border-color: rgba(255, 0, 85, 0.6);
      background: rgba(255, 0, 85, 0.12);
      color: #ffa4c2;
    }

    .skills-grid li:first-child .skill-sigil {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .skills-grid li:first-child:hover {
      background: rgba(255, 0, 85, 0.22);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }

    /* Holographic Dimension Bar */
    .holo-banner {
      margin-top: 10px;
      height: 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(
        115deg,
        rgba(255, 0, 85, 0.22) 15%,
        rgba(0, 243, 255, 0.45) 35%,
        rgba(255, 230, 0, 0.35) 55%,
        rgba(0, 243, 255, 0.25) 75%
      );
      background-size: 200% 100%;
      animation: holographic-foil 4s linear infinite;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 1.8px;
      color: #ffffff;
      text-shadow: 0 0 5px #000;
      position: relative;
      z-index: 3;
    }

    /* Telemetry Footer */
    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      position: relative;
      z-index: 3;
    }

    .footer-cell span {
      font-size: 9.5px;
      font-weight: 600;
    }

    .footer-cell strong {
      display: block;
      color: var(--suit);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .anomaly-tag {
      text-align: right;
    }

    .anomaly-tag strong {
      color: var(--accent);
    }
  </style>
