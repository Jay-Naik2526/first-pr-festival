>

    .spider-card {
      --suit: #e62429;
      width: 320px; height: 440px;
      box-sizing: border-box; padding: 22px;
      font-family: system-ui, sans-serif; color: #e8e6e3;
      background: radial-gradient(circle at 30% 0%, #2a0508, #08080a 70%);
