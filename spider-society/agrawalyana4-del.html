<!--
  SPIDER-ID CARD — weave your own suit.

  RULES
  1. Rename this file to <your-github-username>.html
  2. Internal CSS only — keep it inside the <style> block below.
  3. No <script> tags. They are stripped and CI will reject them.
  4. Everything must fit inside 320 x 440. That's the card.
  5. Keep the four data- attributes on .spider-card — the roster reads them.

  Everything else is yours. Go wild.
-->
```html
<!-- Save this file as: agrawalyana4-del.html -->
<div
  class="spider-card"
  data-name="Yana Agrawal"
  data-alias="mysterio_4"
  data-github="agrawalyana4-del"
  data-suit="#8C1D18"
>
  <style>
    /* ── Old Book Style + Rough Brown Pages + Spider-Man Theme ──────── */
    .spider-card {
      --suit: #8c1d18;
      --spider-blue: #1b324d;
      --rough-brown: #c4a482;
      --aged-paper: #d8be9b;
      --dark-ink: #2b1810;
      --leather-edge: #1a0f0a;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 16px;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--dark-ink);
      background-color: var(--leather-edge);
      border: 8px solid #120905;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      perspective: 1000px;
    }

    /* Stacked Page Edge Texture */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: 5px;
      background: #7a5c43;
      border-radius: 6px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    /* Webbing overlay across the card background */
    .web-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        repeating-linear-gradient(45deg, rgba(140, 29, 24, 0.08) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(-45deg, rgba(140, 29, 24, 0.08) 0 1px, transparent 1px 12px);
      pointer-events: none;
      z-index: 1;
    }

    /* Main Book Deck */
    .book-container {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 800px;
      z-index: 2;
    }

    /* Base Rough Brown Parchment Page */
    .page-static {
      position: absolute;
      inset: 0;
      background-color: var(--aged-paper);
      background-image: 
        radial-gradient(#b89368 15%, transparent 16%),
        radial-gradient(#9e774f 15%, transparent 16%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
      border: 1px solid #6e4f3a;
      border-radius: 4px;
      padding: 14px;
      box-sizing: border-box;
      box-shadow: inset 0 0 20px rgba(43, 24, 16, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Animated Flipping Page Effect */
    .page-flip {
      position: absolute;
      inset: 0;
      background-color: var(--rough-brown);
      border: 1px solid #5a3d28;
      border-radius: 4px;
      transform-origin: left center;
      animation: flipContinuous 5.5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
      box-shadow: -6px 0 16px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
      opacity: 0.85;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0,0,0,0.04) 0px,
        rgba(0,0,0,0.04) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    @keyframes flipContinuous {
      0% {
        transform: rotateY(0deg);
        opacity: 0.95;
      }
      32% {
        transform: rotateY(-140deg);
        opacity: 0.25;
      }
      38%, 100% {
        transform: rotateY(-180deg);
        opacity: 0;
      }
    }

    /* Frame and Spider Aesthetic Elements */
    .book-frame {
      border: 1px dashed var(--suit);
      padding: 10px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* Spider-Web Corner Accents */
    .corner-web {
      position: absolute;
      width: 38px;
      height: 38px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 2;
    }

    .tl { top: -2px; left: -2px; }
    .tr { top: -2px; right: -2px; transform: scaleX(-1); }
    .bl { bottom: -2px; left: -2px; transform: scaleY(-1); }
    .br { bottom: -2px; right: -2px; transform: scale(-1); }

    .header-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Spider Emblem Frame Around Avatar */
    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--suit);
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(140, 29, 24, 0.3);
      filter: sepia(0.2);
      background-color: var(--rough-brown);
      display: block;
    }

    .alias {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      color: var(--suit);
      font-style: italic;
      font-weight: bold;
      text-shadow: 1px 1px 0px rgba(216, 190, 155, 0.8);
    }

    .name {
      margin: 2px 0 0;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: bold;
      color: var(--spider-blue);
    }

    .handle {
      margin-top: 2px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      color: var(--suit);
    }

    .spider-divider {
      text-align: center;
      font-size: 12px;
      color: var(--suit);
      margin: 2px 0;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .divider-line {
      height: 1px;
      flex: 1;
      background-color: var(--suit);
      opacity: 0.5;
    }

    .skills-title {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      color: var(--spider-blue);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .skills {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 5px 10px;
      font-size: 11px;
      font-style: italic;
      background: rgba(196, 164, 130, 0.45);
      border: 1px solid #8c5d3b;
      border-radius: 4px;
      display: flex;
      align-items: center;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.12);
      color: var(--dark-ink);
    }

    /* Vintage Web/Spider Bullet Symbol */
    .skills li::before {
      content: "🕸";
      font-size: 10px;
      color: var(--suit);
      margin-right: 8px;
      font-style: normal;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-family: 'Courier New', Courier, monospace;
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--spider-blue);
      border-top: 1px double var(--suit);
      padding-top: 6px;
      font-weight: bold;
    }
  </style>

  <div class="web-overlay"></div>

  <div class="book-container">
    <!-- Animated Rough Brown Flipping Page -->
    <div class="page-flip"></div>

    <!-- Main Parchment Page -->
    <div class="page-static">
      <div class="book-frame">
        <!-- Spider-Web Corner SVG Art -->
        <svg class="corner-web tl" viewBox="0 0 40 40" fill="none" stroke="#8c1d18" stroke-width="1.2">
          <path d="M 0,0 L 40,40 M 0,20 L 20,40 M 20,0 L 40,20"/>
          <path d="M 10,0 Q 10,10 0,10 M 25,0 Q 25,25 0,25 M 38,0 Q 38,38 0,38"/>
        </svg>
        <svg class="corner-web tr" viewBox="0 0 40 40" fill="none" stroke="#8c1d18" stroke-width="1.2">
          <path d="M 0,0 L 40,40 M 0,20 L 20,40 M 20,0 L 40,20"/>
          <path d="M 10,0 Q 10,10 0,10 M 25,0 Q 25,25 0,25 M 38,0 Q 38,38 0,38"/>
        </svg>
        <svg class="corner-web bl" viewBox="0 0 40 40" fill="none" stroke="#8c1d18" stroke-width="1.2">
          <path d="M 0,0 L 40,40 M 0,20 L 20,40 M 20,0 L 40,20"/>
          <path d="M 10,0 Q 10,10 0,10 M 25,0 Q 25,25 0,25 M 38,0 Q 38,38 0,38"/>
        </svg>
        <svg class="corner-web br" viewBox="0 0 40 40" fill="none" stroke="#8c1d18" stroke-width="1.2">
          <path d="M 0,0 L 40,40 M 0,20 L 20,40 M 20,0 L 40,20"/>
          <path d="M 10,0 Q 10,10 0,10 M 25,0 Q 25,25 0,25 M 38,0 Q 38,38 0,38"/>
        </svg>

        <!-- Header Profile Information -->
        <div class="header-area">
          <div class="avatar-wrapper">
            <img class="avatar" src="https://github.com/agrawalyana4-del.png" alt="Yana Agrawal" />
          </div>
          <div>
            <h1 class="alias">mysterio_4</h1>
            <p class="name">Yana Agrawal</p>
            <p class="handle">@agrawalyana4-del</p>
          </div>
        </div>

        <div class="spider-divider">
          <div class="divider-line"></div>
          <span>🕷</span>
          <div class="divider-line"></div>
        </div>

        <!-- Skills Section -->
        <div>
          <div class="skills-title">✦ Mastered Crafts ✦</div>
          <ul class="skills">
            <li>Writing</li>
            <li>Art and Craft</li>
            <li>Mandala Art</li>
          </ul>
        </div>

        <!-- Spider-Society Footer -->
        <div class="footer">
          <span>Spider-Society</span>
          <span>Earth-1610</span>
        </div>
      </div>
    </div>
  </div>
</div>

```
