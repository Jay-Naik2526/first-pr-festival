  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    .spider-card {
      --suit: #00f0ff;
      --pink: #ff2bd6;
      --dark: #050509;
      --grid: rgba(0, 240, 255, 0.1);

      width: 320px;
      height: 480px; /* Slightly taller for breathing room */
      box-sizing: border-box;
      padding: 24px;
      position: relative;
      overflow: hidden;

      font-family: 'Share Tech Mono', monospace, Arial, sans-serif;
      color: white;

      background:
        radial-gradient(circle at 85% 15%, rgba(255, 43, 214, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
        var(--dark);

      border: 1px solid rgba(0, 240, 255, 0.5);
      clip-path: polygon(
        0 20px,
        20px 0,
        300px 0,
        320px 20px,
        320px 460px,
        300px 480px,
        20px 480px,
        0 460px
      );

      box-shadow:
        0 0 20px rgba(0, 240, 255, 0.2),
        inset 0 0 40px rgba(0, 240, 255, 0.1);

      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: float 6s ease-in-out infinite;
    }

    .spider-card:hover {
      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.4),
        inset 0 0 60px rgba(255, 43, 214, 0.15);
      border: 1px solid var(--suit);
      transform: translateY(-5px);
    }

    /* Animated Cyber Grid */
    .spider-card::before {
      content: "";
      position: absolute;
      inset: -100%;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 25px 25px;
      pointer-events: none;
      animation: gridMove 20s linear infinite;
      opacity: 0.5;
    }

    /* Holographic Scanline */
    .spider-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--pink);
      opacity: 0.8;
      box-shadow: 0 0 10px var(--pink), 0 0 20px var(--pink);
      pointer-events: none;
      animation: scanline 4s linear infinite;
    }

    .scan {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--suit);
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      padding-bottom: 8px;
    }

    .scan-right {
      color: var(--pink);
      animation: blink 2s infinite;
    }

    /* High-Tech Hexagon Avatar */
    .avatar-container {
      position: relative;
      z-index: 2;
      width: 90px;
      height: 90px;
      margin: 25px auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, var(--suit), var(--pink));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      padding: 3px; /* Creates the border effect */
      transition: transform 0.3s ease;
    }

    .spider-card:hover .avatar-container {
      transform: scale(1.05) rotate(5deg);
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      filter: contrast(1.2) saturate(1.3);
    }

    .identity {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .alias {
      margin: 0;
      font-family: Impact, sans-serif;
      font-size: 34px;

    .box:nth-child(even)::before {

    @keyframes scanline {
      0% { top: -5%; opacity: 0; }

      0% { transform: translate(0, 0); }

      0%, 100% { transform: translate(0); text-shadow: 2px 2px 0 var(--pink), -2px -2px 0 var(--suit); }
      2% { transform: translate(-2px, 1px); text-shadow: -2px -1px 0 var(--pink), 2px 2px 0 var(--suit); }
      4% { transform: translate(2px, -1px); text-shadow: 2px -2px 0 var(--pink), -2px 1px 0 var(--suit); }
      6% { transform: translate(0); text-shadow: 2px 2px 0 var(--pink), -2px -2px 0 var(--suit); }
    }
