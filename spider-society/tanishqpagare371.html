<div

  <style>

    /* =====================================================
       BASE CARD
       ===================================================== */

    .spider-card {
      width: 320px;
      height: 440px;

      position: relative;
      overflow: hidden;
      box-sizing: border-box;

      border: 2px solid #e62429;
      border-radius: 18px;

      background: #030307;

      color: white;

      font-family:
        "Arial Black",
        "Segoe UI",
        system-ui,
        sans-serif;

      box-shadow:
        0 0 20px rgba(230, 36, 41, 0.45),
        0 0 60px rgba(230, 36, 41, 0.18);

      isolation: isolate;
    }


    /* =====================================================
       SPIDER-MAN CINEMATIC BACKGROUND
       ===================================================== */

    .spider-bg {
      position: absolute;

      inset: -7%;

      width: 114%;
      height: 114%;

      object-fit: cover;
      object-position: center;

      z-index: 0;

      filter:
        contrast(1.25)
        saturate(1.2)
        brightness(0.8);

      animation:
        cinematicZoom 12s ease-in-out infinite alternate;
    }


    /* =====================================================
       SLOW CINEMATIC CAMERA MOVEMENT
       ===================================================== */

    @keyframes cinematicZoom {

      0% {
        transform:
          scale(1)
          translate3d(0, 0, 0);
      }

      50% {
        transform:
          scale(1.045)
          translate3d(-1%, -0.5%, 0);
      }

      100% {
        transform:
          scale(1.08)
          translate3d(1%, 0.5%, 0);
      }

    }


    /* =====================================================
       CINEMATIC COLOR GRADING
       ===================================================== */

    .cinematic {
      position: absolute;

      inset: 0;

      z-index: 1;

      background:

        radial-gradient(
          ellipse at 75% 25%,
          rgba(230, 36, 41, 0.48),
          transparent 42%
        ),

        radial-gradient(
          ellipse at 5% 70%,
          rgba(0, 100, 255, 0.22),
          transparent 40%
        ),

        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.75),
          transparent 34%
        ),

        linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.98),
          rgba(0, 0, 0, 0.65) 30%,
          transparent 62%
        ),

        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.78),
          transparent 60%,
          rgba(0, 0, 0, 0.25)
        );

      animation:
        colorPulse 7s ease-in-out infinite alternate;
    }


    @keyframes colorPulse {

      0% {
        opacity: 0.82;
      }

      100% {
        opacity: 1;
      }

    }


    /* =====================================================
       VIGNETTE
       ===================================================== */

    .vignette {
      position: absolute;

      inset: 0;

      z-index: 2;

      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0, 0, 0, 0.78) 100%
        );

      pointer-events: none;
    }


    /* =====================================================
       MOVING CINEMATIC SCANLINE
       ===================================================== */

    .scanlines {
      position: absolute;

      left: 0;
      right: 0;

      top: -20%;

      height: 20%;

      z-index: 4;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(0, 234, 255, 0.13),
          rgba(255, 255, 255, 0.04),
          transparent
        );

      filter:
        blur(1px);

      animation:
        scanMove 5s linear infinite;

      pointer-events: none;
    }


    @keyframes scanMove {

      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(600%);
      }

    }


    /* =====================================================
       FILM GRAIN / FLICKER
       ===================================================== */

    .grain {
      position: absolute;

      inset: 0;

      z-index: 5;

      opacity: 0.1;

      background:
        repeating-radial-gradient(
          circle at 0 0,
          rgba(255,255,255,0.13) 0,
          rgba(255,255,255,0.13) 1px,
          transparent 1px,
          transparent 4px
        );

      animation:
        filmFlicker 0.18s steps(2) infinite;

      pointer-events: none;
    }


    @keyframes filmFlicker {

      0% {
        opacity: 0.07;
      }

      50% {
        opacity: 0.13;
      }

      100% {
        opacity: 0.08;
      }

    }


    /* =====================================================
       TOP LABEL
       ===================================================== */

    .top-label {
      position: absolute;

      top: 19px;
      left: 20px;

      z-index: 10;

      font-family: monospace;

      font-size: 8px;

      letter-spacing: 3px;

      color: rgba(255,255,255,0.72);

      text-transform: uppercase;

      animation:
        labelFade 3s ease-in-out infinite alternate;
    }


    .top-label span {
      color: #e62429;

      text-shadow:
        0 0 10px rgba(230,36,41,0.9);
    }


    @keyframes labelFade {

      0% {
        opacity: 0.55;
      }

      100% {
        opacity: 1;
      }

    }


    /* =====================================================
       SPIDER SOCIETY MARK
       ===================================================== */

    .society-mark {
      position: absolute;

      top: 16px;
      right: 18px;

      z-index: 10;

      width: 32px;
      height: 32px;

      border: 1px solid rgba(255,255,255,0.45);

      transform: rotate(45deg);

      background:
        rgba(0,0,0,0.3);

      animation:
        markPulse 2.5s ease-in-out infinite;
    }


    .society-mark::after {
      content: "S";

      position: absolute;

      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      transform: rotate(-45deg);

      font-size: 14px;

      color: #e62429;

      text-shadow:
        0 0 10px rgba(230,36,41,0.9);
    }


    @keyframes markPulse {

      0%,
      100% {
        box-shadow:
          0 0 5px rgba(230,36,41,0.25);
      }

      50% {
        box-shadow:
          0 0 25px rgba(230,36,41,0.75);
      }

    }


    /* =====================================================
       GITHUB AVATAR
       ===================================================== */

    .avatar {
      position: absolute;

      top: 58px;
      left: 20px;

      width: 58px;
      height: 58px;

      object-fit: cover;

      border-radius: 50%;

      border: 2px solid white;

      z-index: 10;

      box-shadow:
        0 0 0 3px rgba(230,36,41,0.35),
        0 0 20px rgba(230,36,41,0.65);

      animation:
        avatarGlow 3s ease-in-out infinite alternate;
    }


    @keyframes avatarGlow {

      0% {
        box-shadow:
          0 0 0 3px rgba(230,36,41,0.25),
          0 0 10px rgba(230,36,41,0.35);
      }

      100% {
        box-shadow:
          0 0 0 3px rgba(230,36,41,0.55),
          0 0 30px rgba(230,36,41,0.85);
      }

    }


    /* =====================================================
       SYSTEM STATUS
       ===================================================== */

    .status {
      position: absolute;

      top: 68px;
      right: 20px;

      z-index: 10;

      font-family: monospace;

      font-size: 7px;

      letter-spacing: 2px;

      color: #00ff9d;

      text-transform: uppercase;

      animation:
        statusBlink 2s ease-in-out infinite;
    }


    .status::before {
      content: "●";

      margin-right: 5px;

      text-shadow:
        0 0 10px #00ff9d;
    }


    @keyframes statusBlink {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }

    }


    /* =====================================================
       MAIN TITLE
       ===================================================== */

    .title {
      position: absolute;

      left: 20px;
      right: 20px;

      bottom: 172px;

      z-index: 10;

      animation:
        titleReveal 1.4s ease-out both;
    }


    @keyframes titleReveal {

      0% {
        opacity: 0;

        transform:
          translateY(18px);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .small-title {
      margin-bottom: 5px;

      font-family: monospace;

      font-size: 8px;

      letter-spacing: 4px;

      color: rgba(255,255,255,0.65);

      text-transform: uppercase;
    }


    /* =====================================================
       SPIDER TITLE GLOW
       ===================================================== */

    .alias {
      margin: 0;

      font-size: 42px;

      line-height: 0.88;

      letter-spacing: -1px;

      font-weight: 950;

      color: white;

      text-transform: uppercase;

      text-shadow:
        3px 3px 0 #e62429,
        0 0 20px rgba(230,36,41,0.55);

      animation:
        titleGlow 3s ease-in-out infinite alternate;
    }


    @keyframes titleGlow {

      0% {
        text-shadow:
          3px 3px 0 #e62429,
          0 0 12px rgba(230,36,41,0.4);
      }

      100% {
        text-shadow:
          3px 3px 0 #e62429,
          0 0 35px rgba(230,36,41,0.95);
      }

    }


    .alias-line {
      width: 85px;

      height: 4px;

      margin-top: 10px;

      background: #e62429;

      box-shadow:
        0 0 15px rgba(230,36,41,0.8);

      animation:
        linePulse 2s ease-in-out infinite alternate;
    }


    @keyframes linePulse {

      from {
        width: 45px;
      }

      to {
        width: 105px;
      }

    }


    /* =====================================================
       NAME
       ===================================================== */

    .name {
      margin: 10px 0 0;

      font-size: 14px;

      font-weight: 600;

      text-transform: uppercase;

    }


    /* =====================================================
       SKILL PANEL
       ===================================================== */

    .skill-panel {
      position: absolute;

      left: 20px;
      right: 20px;

      bottom: 82px;

      z-index: 10;

      padding-top: 9px;

      border-top:
        1px solid rgba(255,255,255,0.3);

    .skill-label {
      font-family: monospace;

      font-size: 7px;

      letter-spacing: 3px;

      color: #00eaff;

      text-transform: uppercase;

      margin-bottom: 7px;

      animation:
        cyanPulse 2s ease-in-out infinite alternate;
    }


    @keyframes cyanPulse {

      from {
        text-shadow:
          0 0 3px rgba(0,234,255,0.2);
      }

      to {
        text-shadow:
          0 0 12px rgba(0,234,255,0.9);
      }

    }


    .skills {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      padding: 0;
      margin: 0;

      list-style: none;
    }


    .skills li {
      padding: 4px 8px;

      font-family: monospace;

      font-size: 8px;

      letter-spacing: 0.5px;

      color: white;

      background:
        rgba(0,0,0,0.52);

      border:
        1px solid rgba(255,255,255,0.35);

      text-transform: uppercase;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease;

      animation:
        skillFloat 4s ease-in-out infinite alternate;
    }


    .skills li:nth-child(2) {
      animation-delay: 0.5s;
    }

    .skills li:nth-child(3) {
      animation-delay: 1s;
    }


    @keyframes skillFloat {

      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-2px);
      }

    }


    /* =====================================================
       MOVING LIGHT STREAK
       ===================================================== */

    .light-bar {
      position: absolute;

      left: -100%;

      bottom: 72px;

      width: 70%;

      height: 2px;

      z-index: 11;

      background:
        linear-gradient(

          white,
          transparent
        );

      box-shadow:
        0 0 15px rgba(230,36,41,0.9);

      animation:
        lightSweep 4s ease-in-out infinite;
    }


    @keyframes lightSweep {

      0% {
        left: -80%;
      }

      45% {
        left: 120%;
      }

      100% {
        left: 120%;
      }

    }


    /* =====================================================
       FOOTER

    .footer {
      position: absolute;

      left: 20px;

      display: flex;

      justify-content: space-between;

      font-family: monospace;

      font-size: 7px;

      letter-spacing: 2px;

      color: rgba(255,255,255,0.55);

      text-transform: uppercase;
    }


    .earth {
      color: #e62429;

      text-shadow:
        0 0 10px rgba(230,36,41,0.8);

      animation:
        earthPulse 2.5s ease-in-out infinite alternate;
    }


    @keyframes earthPulse {

      from {
        opacity: 0.5;
      }

      to {
        opacity: 1;
      }

    }


    /* =====================================================

    .corner {

    }


    .tl {
