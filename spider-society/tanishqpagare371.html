<!--
  SPIDER-ID CARD — EARTH-26038
  Tanishq Pagare // Dark Spider-Verse Edition

  Rules respected:
  - 320 x 440 card
  - Internal CSS only
  - No JavaScript
  - Required data-* attributes preserved
-->

<div
  class="spider-card"
  data-name="Tanishq Pagare"
  data-alias="The Dark Weaver"
  data-github="tanishqpagare371"
  data-suit="#E62429"
>
  <style>
    /* ─────────────────────────────────────────────
       DARK SPIDER-VERSE // EARTH-26038
       ───────────────────────────────────────────── */

    .spider-card {
      --red: #e62429;
      --dark-red: #8e1116;
      --cream: #f4ead3;
      --black: #09090b;
      --grey: #18181b;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;

      padding: 18px;

      color: var(--cream);
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;

      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(230, 36, 41, 0.28),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #050505 0%,
          #111113 52%,
          #09090b 100%
        );

      border: 4px solid var(--red);
      box-shadow:
        8px 8px 0 #000,
        0 0 0 2px var(--cream),
        0 0 30px rgba(230, 36, 41, 0.35);

      transform: rotate(-0.4deg);
    }

    /* ───────── HALFTONE BACKGROUND ───────── */

    .spider-card::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          rgba(244, 234, 211, 0.18) 1.3px,
          transparent 1.3px
        );

      background-size: 9px 9px;

      opacity: 0.28;
      mix-blend-mode: screen;

      pointer-events: none;
    }

    /* Red comic panel */

    .spider-card::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      right: -95px;
      top: -70px;

      background:
        repeating-linear-gradient(
          45deg,
          transparent 0 9px,
          rgba(230, 36, 41, 0.32) 10px 11px
        );

      border: 3px solid rgba(230, 36, 41, 0.5);

      transform: rotate(18deg);

      pointer-events: none;
    }

    /* ───────── TOP BAR ───────── */

    .top-bar {
      position: relative;
      z-index: 5;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-bottom: 8px;

      border-bottom: 2px solid var(--cream);

      font-family: monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.4px;
    }

    .classified {
      color: var(--red);
    }

    .earth {
      color: var(--cream);
    }

    /* ───────── COMIC BURST ───────── */

    .burst {
      position: absolute;

      right: -6px;
      top: 82px;

      width: 72px;
      height: 72px;

      background: var(--red);

      clip-path: polygon(
        50% 0%,
        61% 25%,
        82% 5%,
        77% 32%,
        100% 29%,
        78% 49%,
        98% 63%,
        72% 65%,
        78% 93%,
        56% 72%,
        42% 100%,
        39% 71%,
        12% 84%,
        29% 59%,
        0% 51%,
        28% 41%,
        9% 18%,
        37% 28%
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--cream);

      font-family: Impact, sans-serif;
      font-size: 11px;
      text-align: center;

      transform: rotate(12deg);

      z-index: 4;

      box-shadow: 4px 4px 0 #000;
    }

    /* ───────── AVATAR ───────── */

    .avatar-frame {
      position: relative;
      z-index: 4;

      width: 92px;
      height: 92px;

      margin-top: 16px;

      transform: rotate(-3deg);

      background: var(--cream);

      padding: 5px;

      box-shadow:
        6px 6px 0 var(--red),
        10px 10px 0 #000;
    }

    .avatar {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border: 3px solid var(--black);

      filter:
        grayscale(25%)
        contrast(1.2);
    }

    /* ───────── ALIAS ───────── */

    .alias {
      position: relative;
      z-index: 5;

      margin: 16px 0 0;

      max-width: 260px;

      font-size: 30px;
      line-height: 0.92;

      text-transform: uppercase;

      color: var(--cream);

      letter-spacing: 0.5px;

      text-shadow:
        3px 3px 0 var(--red),
        6px 6px 0 #000;

      transform: skew(-4deg);
    }

    .alias span {
      color: var(--red);
    }

    /* ───────── NAME ───────── */

    .identity {
      position: relative;
      z-index: 5;

      margin-top: 7px;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name {
      margin: 0;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 900;

      color: var(--cream);

      text-transform: uppercase;
    }

    .handle {
      margin: 0;

      font-family: monospace;
      font-size: 9px;

      color: #aaa;
    }

    /* ───────── SKILLS ───────── */

    .skills-title {
      position: relative;
      z-index: 5;

      display: inline-block;

      margin-top: 14px;
      margin-bottom: 6px;

      padding: 3px 7px;

      color: var(--black);
      background: var(--cream);

      font-family: monospace;
      font-size: 9px;
      font-weight: bold;

      letter-spacing: 1px;

      transform: rotate(-2deg);
    }

    .skills {
      position: relative;
      z-index: 5;

      display: flex;
      flex-wrap: wrap;
      gap: 5px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .skills li {
      padding: 5px 8px;

      color: var(--cream);

      background: var(--dark-red);

      border: 2px solid var(--cream);

      font-family: monospace;
      font-size: 9px;
      font-weight: bold;

      text-transform: uppercase;

      box-shadow: 3px 3px 0 #000;

      transform: skew(-7deg);
    }

    .skills li:nth-child(2) {
      background: var(--red);
      color: #fff;
      transform: skew(5deg);
    }

    .skills li:nth-child(3) {
      background: var(--grey);
    }

    .skills li:nth-child(4) {
      background: var(--cream);
      color: var(--black);
    }

    /* ───────── COMIC WORDS ───────── */

    .thwip {
      position: absolute;

      left: -5px;
      bottom: 68px;

      color: var(--cream);

      font-family: Impact, sans-serif;
      font-size: 20px;

      letter-spacing: 1px;

      transform: rotate(-12deg);

      text-shadow:
        2px 2px 0 var(--red),
        4px 4px 0 #000;

      z-index: 3;
    }

    .krak {
      position: absolute;

      right: 8px;
      bottom: 92px;

      color: var(--red);

      font-family: Impact, sans-serif;
      font-size: 22px;

      transform: rotate(8deg);

      text-shadow:
        2px 2px 0 var(--cream),
        4px 4px 0 #000;

      z-index: 3;
    }

    /* ───────── WEB LINES ───────── */

    .web {
      position: absolute;

      right: -20px;
      bottom: 30px;

      width: 145px;
      height: 145px;

      border-radius: 50%;

      opacity: 0.28;

      background:
        repeating-radial-gradient(
          circle,
          transparent 0 15px,
          var(--cream) 16px 17px,
          transparent 18px 29px
        ),
        repeating-conic-gradient(
          from 0deg,
          transparent 0deg 14deg,
          var(--cream) 15deg 16deg,
          transparent 17deg 29deg
        );

      z-index: 1;
    }

    /* ───────── FOOTER ───────── */

    .footer {
      position: absolute;

      left: 18px;
      right: 18px;
      bottom: 13px;

      z-index: 8;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-top: 7px;

      border-top: 2px solid var(--cream);

      font-family: monospace;
      font-size: 8px;
      font-weight: bold;

      letter-spacing: 1px;

      color: var(--cream);
    }

    .status {
      color: var(--red);
    }

    /* ───────── SPIDER-SENSE ANIMATION ───────── */

    .avatar-frame::after {
      content: "";

      position: absolute;

      inset: -7px;

      border: 2px solid var(--red);

      opacity: 0;

      animation: spiderSense 2.8s infinite;
    }

    @keyframes spiderSense {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }

      35% {
        opacity: 0.8;
      }

      100% {
        transform: scale(1.18);
        opacity: 0;
      }
    }

    /* ───────── PRINT / REDUCED MOTION FRIENDLY ───────── */

    @media (prefers-reduced-motion: reduce) {
      .avatar-frame::after {
        animation: none;
      }
    }
  </style>

  <div class="top-bar">
    <span class="classified">SPIDER-SOCIETY // CLASSIFIED</span>
    <span class="earth">26038</span>
  </div>

  <div class="burst">
    THWIP!
  </div>

  <div class="avatar-frame">
    <img
      class="avatar"
      src="https://github.com/tanishqpagare371.png"
      alt="Tanishq Pagare"
    />
  </div>

  <h1 class="alias">
    THE <span>DARK</span><br />
    WEAVER
  </h1>

  <div class="identity">
    <p class="name">Tanishq Pagare</p>
    <p class="handle">@tanishqpagare371</p>
  </div>

  <div class="skills-title">
    SPIDER ABILITIES
  </div>

  <ul class="skills">
    <li>AI / ML</li>
    <li>WEB DEV</li>
    <li>PYTHON</li>
    <li>UI / UX</li>
    <li>PROBLEM SOLVING</li>
  </ul>

  <div class="thwip">THWIP!</div>
  <div class="krak">KRAK!</div>

  <div class="web"></div>

  <div class="footer">
    <span>EARTH-26038</span>
    <span class="status">● SPIDER ACTIVE</span>
  </div>
</div>
```
