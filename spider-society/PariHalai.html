<div
  class="spider-card"
  data-name="Pari Halai"
  data-alias="Pariiiiii"
  data-github="PariHalai"
  data-suit="#E62429"
>
  <style>
    .spider-card {
      --suit: #e62429;
      --core: #22d3ee;
      --node: #818cf8;
      --ink: #030407;

      width: 320px;
      height: 440px;
      box-sizing: border-box;
      padding: 18px;
      font-family: system-ui, sans-serif;
      color: #e7ecef;
      background: var(--ink);
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    .circuit-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(34,211,238,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.08) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      mix-blend-mode: screen;
      z-index: 0;
      animation: nebula-pulse ease-in-out infinite;
    }
    .nebula.n1 { width: 190px; height: 150px; top: -50px; left: -60px; background: rgba(34,211,238,0.5); animation-duration: 10s; }
    .nebula.n2 { width: 170px; height: 170px; bottom: -60px; right: -50px; background: rgba(129,140,248,0.5); animation-duration: 12s; animation-delay: -3s; }

    @keyframes nebula-pulse {
      0%, 100% { opacity: 0.28; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.12); }
    }

    .galaxy-swirl {
      position: absolute;
      inset: -40%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(34,211,238,0.10) 50deg,
        transparent 110deg,
        rgba(129,140,248,0.10) 200deg,
        transparent 260deg
      );
      filter: blur(20px);
      animation: swirl 70s linear infinite;
      z-index: 0;
    }

    @keyframes swirl { to { transform: rotate(360deg); } }

    .stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    .star.big { width: 3px; height: 3px; box-shadow: 0 0 4px 1px rgba(255,255,255,0.75); }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .code-drop {
      position: absolute;
      font-family: ui-monospace, monospace;
      font-size: 9px;
      line-height: 1.3;
      color: var(--core);
      opacity: 0;
      white-space: pre;
      z-index: 1;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 0; }
      10%  { opacity: 0.55; }
      85%  { opacity: 0.55; }
      100% { transform: translateY(60px); opacity: 0; }
    }

    .dust {
      position: absolute;
      border-radius: 50%;
      background: var(--core);
      opacity: 0.5;
      z-index: 1;
      pointer-events: none;
      animation: drift ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(var(--dx, 18px), var(--dy, -24px)); }
    }

    .shooting-star {
      position: absolute;
      width: 70px;
      height: 2px;
      background: linear-gradient(90deg, #fff, rgba(255,255,255,0));
      border-radius: 2px;
      z-index: 1;
      opacity: 0;
      animation: shoot ease-in infinite;
    }

    @keyframes shoot {
      0%   { opacity: 0; transform: translate(0, 0) rotate(35deg); }
      4%   { opacity: 1; }
      18%  { opacity: 0; transform: translate(160px, 115px) rotate(35deg); }
      100% { opacity: 0; }
    }

    .shooting-star.s1 { top: 6%; left: 4%; animation-duration: 6s; animation-delay: 0.5s; }
    .shooting-star.s2 { top: 50%; left: -6%; width: 50px; animation-duration: 8.5s; animation-delay: 3.2s; }

    .probe {
      position: absolute;
      top: 0;
      left: 0;
      width: 16px;
      height: 6px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      animation: flyby 13s ease-in-out infinite;
      animation-delay: 3s;
    }

    .probe-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #cbd5e1, var(--core));
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(34,211,238,0.7);
    }

    .probe-wing {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 2px;
      background: rgba(129,140,248,0.85);
      transform: translateY(-50%);
    }
    .probe-wing.left { left: -9px; }
    .probe-wing.right { right: -9px; }

    .probe::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 100%;
      width: 12px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(34,211,238,0.7));
      transform: translateY(-50%);
    }

    @keyframes flyby {
      0%   { transform: translate(-30px, 360px) rotate(-28deg) scale(0.9); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(165px, 150px) rotate(-24deg) scale(1); }
      88%  { opacity: 1; }
      100% { transform: translate(370px, -50px) rotate(-18deg) scale(0.9); opacity: 0; }
    }

    .radar-ping {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border: 1px solid rgba(34,211,238,0.55);
      border-radius: 50%;
      z-index: 1;
      opacity: 0;
      animation: ping-out 4s ease-out infinite;
    }
    .radar-ping.p2 { animation-delay: 2s; }

    @keyframes ping-out {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(3.4); opacity: 0; }
    }

    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(180deg, transparent, rgba(34,211,238,0.10), transparent);
      z-index: 1;
      pointer-events: none;
      animation: sweep 5s linear infinite;
    }

    @keyframes sweep {
      0%   { transform: translateY(-60px); }
      100% { transform: translateY(460px); }
    }

    .id-tag {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--core);
      text-transform: uppercase;
      opacity: 0.85;
      position: relative;
      z-index: 2;
    }

    .orbit-system {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 4px auto 0;
      z-index: 2;
    }

    .orbit-ring {
      position: absolute;
      border: 1px dashed rgba(34,211,238,0.22);
      border-radius: 50%;
    }
    .orbit-ring.r1 { inset: 0; }
    .orbit-ring.r2 { inset: 34px; border-color: rgba(129,140,248,0.3); }
    .orbit-ring.r3 { inset: 68px; border-color: rgba(34,211,238,0.3); }

    .orbit-spin { position: absolute; animation-name: spin; animation-timing-function: linear; animation-iteration-count: infinite; }
    .spin1 { inset: 0; animation-duration: 18s; }
    .spin2 { inset: 34px; animation-duration: 12s; animation-direction: reverse; animation-delay: -4s; }
    .spin3 { inset: 68px; animation-duration: 9s; animation-delay: -2s; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .orbit-icon {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      background: var(--ink);
      border: 1px solid var(--core);
      border-radius: 5px;
      box-shadow: 0 0 8px rgba(34,211,238,0.45);
    }

    /* icons in .spin1/.spin2/.spin3 counter-rotate so they stay upright */
    .spin1 .orbit-icon { animation: spin 18s linear infinite reverse; }
    .spin2 .orbit-icon { animation: spin 12s linear infinite; border-color: var(--node); box-shadow: 0 0 8px rgba(129,140,248,0.45); }
    .spin3 .orbit-icon { animation: spin 9s linear infinite reverse; }

    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--core);
      box-shadow: 0 0 18px rgba(34,211,238,0.6), 0 0 34px rgba(129,140,248,0.3);
      z-index: 2;
    }
    .core img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .text-block { text-align: center; position: relative; z-index: 2; margin-top: 2px; }

    .alias {
      margin: 0;
      font-size: 21px;
      line-height: 1.05;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--core), #fff 50%, var(--node));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .name { margin: 5px 0 0; font-size: 13px; opacity: 0.75; }
    .handle { margin-top: 2px; font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.5; }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      padding: 0;
      list-style: none;
      position: relative;
      z-index: 2;
    }

    .skills li {
      padding: 4px 9px;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      border: 1px solid rgba(34,211,238,0.4);
      border-radius: 4px;
      background: rgba(34,211,238,0.08);
      color: #cdeeff;
    }

    .footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.5;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 2;
    }
  </style>
